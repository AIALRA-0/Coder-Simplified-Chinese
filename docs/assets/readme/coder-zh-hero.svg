<!-- README hero for the version-locked Coder Simplified Chinese runtime overlay. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Coder Simplified Chinese language overlay</title>
  <desc id="desc">A dark Coder workspace interface moving through an nginx injection layer into a Chinese interface</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#e0e7ff">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420"/>
  </g>
  <g transform="translate(64 70)">
    <rect width="430" height="248" rx="20" fill="#080b12" stroke="#475569" stroke-width="2"/>
    <circle cx="28" cy="28" r="7" fill="#fb7185"/><circle cx="50" cy="28" r="7" fill="#fbbf24"/><circle cx="72" cy="28" r="7" fill="#4ade80"/>
    <path d="M0 54H430" stroke="#334155" stroke-width="2"/>
    <text x="30" y="91" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">工作区</text>
    <g fill="#111827" stroke="#334155">
      <rect x="28" y="115" width="374" height="38" rx="8"/>
      <rect x="28" y="168" width="374" height="52" rx="8"/>
    </g>
    <text x="47" y="140" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="15">owner:demo</text>
    <circle cx="55" cy="194" r="12" fill="#312e81"/>
    <text x="81" y="190" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">demo-workspace</text>
    <text x="81" y="210" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="13">demo-template</text>
    <circle cx="351" cy="194" r="7" fill="#22c55e"/>
    <text x="366" y="199" fill="#4ade80" font-family="Segoe UI,Arial,sans-serif" font-size="14">运行中</text>
  </g>
  <g transform="translate(530 108)">
    <rect width="170" height="166" rx="20" fill="#15112b" stroke="#a78bfa" stroke-width="3"/>
    <text x="85" y="46" fill="#ddd6fe" font-family="Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle">NGINX</text>
    <path d="M38 78H132M38 104H132" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <text x="85" y="142" fill="#c4b5fd" font-family="Consolas,monospace" font-size="13" text-anchor="middle">sub_filter</text>
  </g>
  <path d="M494 191H530M700 191H746" stroke="#38bdf8" stroke-width="5"/>
  <g transform="translate(746 70)">
    <rect width="390" height="248" rx="20" fill="#08111f" stroke="#38bdf8" stroke-width="2"/>
    <rect x="30" y="28" width="155" height="42" rx="10" fill="#172554" stroke="#60a5fa"/>
    <text x="107" y="55" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">语言 · 简体中文</text>
    <text x="30" y="112" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">无需修改上游镜像</text>
    <text x="30" y="151" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="16">运行时文本与属性覆盖</text>
    <text x="30" y="181" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="16">语言切换 · MutationObserver</text>
    <text x="30" y="211" fill="#86efac" font-family="Consolas,monospace" font-size="15">Coder v2.31.6 · strict lock</text>
  </g>
  <text x="600" y="371" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle">CODER SIMPLIFIED CHINESE</text>
  <text x="600" y="402" fill="#bfdbfe" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">External runtime overlay · reversible deployment · exact version guard</text>
</svg>
